# Gifscythe settings example - "Optimize an animation"
# Each line maps to UI controls and to a gifsicle option (see GifsicleCommand).

# --- mode ---
mode = merge

# --- animation ---
optimize = 3
loopcount = 0
delay = 5
threads = 4

# --- whole-gif ---
colors = 128
lossy = 40
dither = 1

# --- inputs / output ---
# Paths are resolved relative to the settings file's directory (examples/),
# which is 3 levels below the repo root, so inputs use ../../../reference_code/.
input = ../../../reference_code/gifsicle/logo.gif
input = ../../../reference_code/gifsicle/logo1.gif
output = /tmp/gifscythe_demo.gif
