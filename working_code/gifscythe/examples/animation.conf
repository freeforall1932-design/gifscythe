# Gifscythe settings example - "Optimize an animation"
# Each line maps to UI controls and to a gifsicle option (see GifsicleCommand).

# --- mode ---
mode = merge

# --- animation ---
optimize = 3
loopcount = 0
delay = 5
threads = 4

# --- whole-gif ---
colors = 128
lossy = 40
dither = 1

# --- inputs / output ---
# Paths are resolved relative to the settings file's directory (examples/).
# The repo holds no image files: build.sh (or ./scripts/fixtures.sh) rebuilds the two upstream
# test images from text into build/fixtures/, one level up from here.
input = ../build/fixtures/logo.gif
input = ../build/fixtures/logo1.gif
output = /tmp/gifscythe_demo.gif
